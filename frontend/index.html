<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess-AI - Allenamento</title>
  </head>
  <body>
    <h1>Allenamento puzzle personalizzato</h1>
    <div id="temi"></div>
    <div id="stato">Caricamento...</div>
    <div id="board"></div>
    <div id="info"></div>
    <div id="stats"></div>
    <button id="prossimo">Prossimo puzzle</button>
    <button id="toggle-progressi">📊 I miei progressi</button>

    <section id="progressi" hidden>
      <h2>I miei progressi</h2>
      <div class="grafico-box"><canvas id="grafico-elo"></canvas></div>
      <div class="grafico-box"><canvas id="grafico-temi"></canvas></div>
      <p id="progressi-vuoto" class="progressi-vuoto" hidden>
        Ancora pochi dati: risolvi qualche puzzle per vedere i progressi.
      </p>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
